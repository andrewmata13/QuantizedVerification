# Environment configuration settings for conda
# export PYTHONPATH="$(pwd):$(pwd)/examples/acasxu:$(pwd)/examples/acasxu/quantized_nn_backreach"

name: quantized-reach-tool
channels:
  - gurobi
  - conda-forge
  - mosek
dependencies:
  - python=3.10
  - numpy=1.23.5
  - gurobi=12.0.3
  - scipy=1.10.1
  - matplotlib=3.6.2
  - cvxpy=1.3.2
  - cvxopt=1.3.2
  - swiglpk=5.0.8
  - onnxruntime=1.13.1
  - termcolor=2.1.1
  - Mosek=10.1.12
