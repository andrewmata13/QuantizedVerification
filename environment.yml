name: quant-verif
channels:
  - nvidia
  - pytorch
  - conda-forge
dependencies:
  - python=3.8
  - pip
  - numpy<2
  - tqdm
  - rich
  - pytorch=2.2.*
  - pytorch-cuda=11.8

  - mesa-libgl-cos7-x86_64  # headless GL libs (Linux), safe to keep

  - pip:
      - stable-baselines3==2.4.0
      - gymnasium[mujoco]==1.0.0
      - shimmy>=2.0.0
      - gym==0.26.2
      - mujoco==3.1.5
      - opencv-python-headless==4.9.0.80